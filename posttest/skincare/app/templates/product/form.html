{% csrf_token %}
<!-- Name Field -->
<div class="mb-3">
    <label for="id_name" class="form-label">Product Name</label>
    <input type="text" class="form-control" id="id_name" name="name" value="{{form.name.value|default_if_none:'' }}" required>
    <div class="invalid-feedback">{{ form.name.errors }}</div>
</div>

<!-- Desc Field -->
<div class="mb-3">
    <label for="id_description" class="form-label">Description</label>
    <input type="text" class="form-control" id="id_description" name="description" value="{{form.description.value|default_if_none:'' }}" required>
    <div class="invalid-feedback">{{ form.description.errors }}</div>
</div>

<!-- price Field -->
<div class="mb-3">
    <label for="id_price" class="form-label">Price</label>
    <input type="text" class="form-control" id="id_price" name="price" value="{{ form.price.value|default_if_none:'' }}" required>
    <div class="invalid-feedback">{{ form.price.errors }}</div>
</div>

<!-- stock Field -->
<div class="mb-3">
    <label for="id_stock" class="form-label">Stock</label>
    <input type="number" class="form-control" id="id_stock" name="stock" value="{{form.stock.value|default_if_none:'' }}" required>
    <div class="invalid-feedback">{{ form.stock.errors }}</div>
</div>

<!-- Admin Field -->
<div class="mb-3">
    <label for="id_admin" class="form-label">Admin</label>
    <select class="form-select" id="id_admin" name="admin" required>
        {% for admin in form.admin.field.queryset %}
        <option value="{{ admin.id }}" {% if admin.id == form.admin.value %}selected{% endif %}>
        {{ admin.name }}
        </option>
        {% endfor %}
    </select>
    <div class="invalid-feedbacks">{{ form.admin.errors }}</div>
</div>
<button type="submit" class="btn btn-primary">Save</button>
